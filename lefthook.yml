# Local git hooks.
#
# pre-commit : fast, staged-file ruff checks only.
# pre-push   : locked Python lint and type checks.
#
# Bypass with `LEFTHOOK=0 git push ...` or `git push --no-verify`; the
# same checks can be run directly with `just lint python`. For full verification
# before opening a PR, use `just verify`.

pre-commit:
  commands:
    ruff-format:
      glob: "*.{py,pyi}"
      run: ruff format --check {staged_files}
    ruff-lint:
      glob: "*.{py,pyi}"
      run: ruff check {staged_files}

pre-push:
  commands:
    lint:
      # Enter the dev shell only when the local tools are unavailable.
      run: |
        if command -v just >/dev/null 2>&1 && command -v uv >/dev/null 2>&1; then
          just lint python
        elif command -v nix >/dev/null 2>&1; then
          ASTRODRIFT_QUIET=1 nix develop -c just lint python
        else
          echo "pre-push checks require just and uv, or nix" >&2
          exit 127
        fi
