name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-pr:
    name: Prepare release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.repository_owner == 'lbparticles' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Open or update the release PR
        uses: release-plz/[email protected]
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tag and create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.repository_owner == 'lbparticles' }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Tag and create the GitHub release
        uses: release-plz/[email protected]
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
