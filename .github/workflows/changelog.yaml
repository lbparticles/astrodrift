name: Changelog check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: CHANGELOG.md updated for merge to main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fail unless CHANGELOG.md changed or skip-changelog label is set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
            exit 0
          fi
          if gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
              --json labels --jq '.labels[].name' | grep -qx 'skip-changelog'; then
            echo "skip-changelog label set; bypassing changelog requirement"
            exit 0
          fi
          echo "::error::Merge to main requires a CHANGELOG.md entry under [Unreleased] (### Added for features, ### Fixed for bug fixes), or the skip-changelog label (dependabot bumps)."
          exit 1
