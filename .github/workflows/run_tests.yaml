# .github/workflows/run-tests.yml
name: (Reusable) Run tests

on:
  workflow_call:
    inputs:
      bucket: { type: string, required: true }
      hash22: { type: string, required: true }
      hash24: { type: string, required: true }
    secrets:
      AWS_ACCESS_KEY_ID: { required: true }
      AWS_SECRET_ACCESS_KEY: { required: true }
      AWS_REGION: { required: true }

jobs:
  run-tests:
    runs-on: [ self-hosted, test ]
    timeout-minutes: 30
    env:
      BUCKET: ${{ inputs.bucket }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v5

      - name: Import runner env (RUNNER_TARGET, SIF_CACHE_DIR)
        shell: bash
        run: |
          echo "RUNNER_TARGET=${RUNNER_TARGET:-}" >> "$GITHUB_ENV"
          echo "SIF_CACHE_DIR=${SIF_CACHE_DIR:-}" >> "$GITHUB_ENV"
          echo "Imported RUNNER_TARGET=${RUNNER_TARGET:-<unset>}"
          echo "Imported SIF_CACHE_DIR=${SIF_CACHE_DIR:-<unset>}"

      - name: Fetch SIF (ubuntu22)
        if: env.RUNNER_TARGET == 'ubuntu22'
        shell: bash
        run: |
          set -euxo pipefail
          SIF_PATH="$SIF_CACHE_DIR/app-ubuntu22-${{ inputs.hash22 }}.sif"
          if [ -f "$SIF_PATH" ]; then
            echo "Using cached SIF: $SIF_PATH"
          else
            tmp="$SIF_PATH.tmp.$$"
            aws s3 cp "s3://${{ env.BUCKET }}/ubuntu22/app-${{ inputs.hash22 }}.sif" "$tmp" --no-progress --only-show-errors
            mv -f "$tmp" "$SIF_PATH"
          fi
          ln -sf "$SIF_PATH" app-ubuntu22.sif
          ls -lh "$SIF_PATH" app-ubuntu22.sif

      - name: Fetch SIF (ubuntu24)
        if: env.RUNNER_TARGET == 'ubuntu24'
        shell: bash
        run: |
          set -euxo pipefail
          SIF_PATH="$SIF_CACHE_DIR/app-ubuntu24-${{ inputs.hash24 }}.sif"
          if [ -f "$SIF_PATH" ]; then
            echo "Using cached SIF: $SIF_PATH"
          else
            tmp="$SIF_PATH.tmp.$$"
            aws s3 cp "s3://${{ env.BUCKET }}/ubuntu24/app-${{ inputs.hash24 }}.sif" "$tmp" --no-progress --only-show-errors
            mv -f "$tmp" "$SIF_PATH"
          fi
          ln -sf "$SIF_PATH" app-ubuntu24.sif
          ls -lh "$SIF_PATH" app-ubuntu24.sif

      - name: Run tests inside SIF (ubuntu22)
        if: env.RUNNER_TARGET == 'ubuntu22'
        shell: bash
        run: |
          set -euxo pipefail
          apptainer exec \
            -B ./:/data/astrodrift \
            --writable-tmpfs \
            --no-mount home \
            --home /data/home/leo \
            --nv \
            --cleanenv \
            --cwd /data/astrodrift \
            ./app-ubuntu22.sif \
            bash -c "cargo clean && uv sync && maturin develop && uv run tests/test.py"

      - name: Run tests inside SIF (ubuntu24)
        if: env.RUNNER_TARGET == 'ubuntu24'
        shell: bash
        run: |
          set -euxo pipefail
          apptainer exec \
            -B ./:/data/astrodrift \
            --writable-tmpfs \
            --no-mount home \
            --home /data/home/leo \
            --nv \
            --cleanenv \
            --cwd /data/astrodrift \
            ./app-ubuntu24.sif \
            bash -c "cargo clean && uv sync && maturin develop && uv run tests/test.py"
