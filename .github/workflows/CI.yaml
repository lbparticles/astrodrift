name: Build Docker + Apptainer Images and Run Tests

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  BUCKET: drift-oci-bucket
  APPTAINER_TMPDIR: /mnt/gha/tmp
  APPTAINER_CACHEDIR: /mnt/gha/cache
  TMPDIR: /mnt/gha/tmp

jobs:
  build:
    runs-on: [ self-hosted, vm ]
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      hash22: ${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}
      hash24: ${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute short hashes for Dockerfiles
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          short_hash() {
            local path="$1"
            git ls-files -z -- "$path/Dockerfile" 2>/dev/null \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -c1-8
          }

          HASH22=$(short_hash container/ubuntu22-cuda12)
          HASH24=$(short_hash container/ubuntu24-cuda12)

          {
            echo "hash_ubuntu22_cuda12=$HASH22"
            echo "hash_ubuntu24_cuda12=$HASH24"
          } >> "$GITHUB_OUTPUT"
      
      - name: Check S3 for existing SIF (ubuntu22-cuda12)
        id: check22
        shell: bash
        run: |
          set -euo pipefail
          KEY="ubuntu22/app-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif"
          if aws s3api head-object --bucket "${BUCKET}" --key "${KEY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found s3://${BUCKET}/${KEY} — skipping ubuntu22 build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Not found: s3://${BUCKET}/${KEY} — will build ubuntu22."
          fi
      
      - name: Check S3 for existing SIF (ubuntu24-cuda12)
        id: check24
        shell: bash
        run: |
          set -euo pipefail
          KEY="ubuntu24/app-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif"
          if aws s3api head-object --bucket "${BUCKET}" --key "${KEY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found s3://${BUCKET}/${KEY} — skipping ubuntu24 build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Not found: s3://${BUCKET}/${KEY} — will build ubuntu24."
          fi

      - name: Build ubuntu22-cuda12 image
        if: steps.check22.outputs.exists == 'false'
        run: |
          docker build \
            -f container/ubuntu22-cuda12/Dockerfile \
            -t ubuntu22-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }} .

      - name: Build ubuntu24-cuda12 image
        if: steps.check24.outputs.exists == 'false'
        run: |
          docker build \
            -f container/ubuntu24-cuda12/Dockerfile \
            -t ubuntu24-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }} .
      
      - name: Prepare scratch for Apptainer
        run: |
          if command -v apptainer >/dev/null 2>&1; then apptainer cache clean -f || true; fi

      - name: Build Apptainer SIF (ubuntu22-cuda12)
        if: steps.check22.outputs.exists == 'false'
        run: |
          set -euxo pipefail
          mkdir -p apptainer/out
          apptainer build \
            apptainer/out/app-ubuntu22-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif \
            docker-daemon://ubuntu22-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}
          ls -lh apptainer/out

      - name: Build Apptainer SIF (ubuntu24-cuda12)
        if: steps.check24.outputs.exists == 'false'
        run: |
          set -euxo pipefail
          mkdir -p apptainer/out
          apptainer build \
            apptainer/out/app-ubuntu24-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif \
            docker-daemon://ubuntu24-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}
          ls -lh apptainer/out

      - name: Upload SIF to S3 (ubuntu22-cuda12)
        if: steps.check22.outputs.exists == 'false'
        run: |
          set -euxo pipefail
          aws s3 cp \
            apptainer/out/app-ubuntu22-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif \
            s3://${{ env.BUCKET }}/ubuntu22/app-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif \
            --metadata artifact-type=application/vnd.apptainer.sif.layer.v1

      - name: Upload SIF to S3 (ubuntu24-cuda12)
        if: steps.check24.outputs.exists == 'false'
        run: |
          set -euxo pipefail
          aws s3 cp \
            apptainer/out/app-ubuntu24-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif \
            s3://${{ env.BUCKET }}/ubuntu24/app-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif \
            --metadata artifact-type=application/vnd.apptainer.sif.layer.v1
          
  test:
    runs-on: [ self-hosted, test ]
    needs: build
    timeout-minutes: 30
    env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
    - uses: actions/checkout@v5
    
    - name: Import RUNNER_TARGET from runner
      shell: bash
      run: |
        echo "RUNNER_TARGET=${RUNNER_TARGET:-}" >> "$GITHUB_ENV"
        echo "RUNNER_TARGET imported as: ${RUNNER_TARGET:-<unset>}"

    - name: Fetch SIF (ubuntu22)
      if: env.RUNNER_TARGET == 'ubuntu22'
      run: |
        set -euxo pipefail
        if [ ! -f app-ubuntu22.sif ]; then
          aws s3 cp \
            s3://${{ env.BUCKET }}/ubuntu22/app-${{ needs.build.outputs.hash22 }}.sif \
            app-ubuntu22.sif --no-progress --only-show-errors
        else:
          echo "SIF already exists locally, skipping download."
        fi

    - name: Fetch SIF (ubuntu24)
      if: env.RUNNER_TARGET == 'ubuntu24'
      run: |
        set -euxo pipefail
        if [ ! -f app-ubuntu24.sif ]; then
          aws s3 cp \
            s3://${{ env.BUCKET }}/ubuntu24/app-${{ needs.build.outputs.hash24 }}.sif \
            app-ubuntu24.sif --no-progress --only-show-errors
        else
          echo "SIF already exists locally, skipping download."
        fi

    - name: Run tests inside SIF (ubuntu22)
      if: env.RUNNER_TARGET == 'ubuntu22'
      run: |
          set -euxo pipefail
          apptainer exec \
            -B ./:/data/astrodrift \
            --writable-tmpfs \
            --no-mount home \
            --home /data/home/leo \
            --nv \
            --cleanenv \
            --cwd /data/astrodrift \
            ./app-ubuntu22.sif \
            bash -c "maturin develop && python tests/test.py"

    - name: Run tests inside SIF (ubuntu24)
      if: env.RUNNER_TARGET == 'ubuntu24'
      run: |
          set -euxo pipefail
          apptainer exec \
            -B ./:/data/astrodrift \
            --writable-tmpfs \
            --no-mount home \
            --home /data/home/leo \
            --nv \
            --cleanenv \
            --cwd /data/astrodrift \
            ./app-ubuntu24.sif \
            bash -c "maturin develop && python tests/test.py"

