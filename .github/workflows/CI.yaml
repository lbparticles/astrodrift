name: Build Docker + Apptainer Images and Run Tests

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  BUCKET: drift-oci-bucket
  # APPTAINER_TMPDIR: /home/ubuntu/tmp
  # APPTAINER_CACHEDIR: /home/ubuntu/cache
  # TMPDIR: /home/ubuntu/tmp

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
      hash22: ${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}
      hash24: ${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}
      need22: ${{ steps.s3check22.outputs.need }}
      need24: ${{ steps.s3check24.outputs.need }}
      need_build: ${{ steps.need.outputs.need_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}   

      - name: Compute short hashes for Dockerfiles
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          short_hash() {
            local path="$1"
            git ls-files -z -- "$path/Dockerfile" 2>/dev/null \
              | xargs -0 sha256sum | sha256sum | cut -c1-8
          }
          echo "hash_ubuntu22_cuda12=$(short_hash container/ubuntu22-cuda12)" >> "$GITHUB_OUTPUT"
          echo "hash_ubuntu24_cuda12=$(short_hash container/ubuntu24-cuda12)" >> "$GITHUB_OUTPUT"

      - name: Check S3 (ubuntu22 SIF)
        id: s3check22
        shell: bash
        run: |
          set -euo pipefail
          KEY="ubuntu22/app-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif"
          if aws s3api head-object --bucket "${{ env.BUCKET }}" --key "${KEY}" >/dev/null 2>&1; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "Found s3://${{ env.BUCKET }}/${KEY}"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "Missing s3://${{ env.BUCKET }}/${KEY}"
          fi

      - name: Check S3 (ubuntu24 SIF)
        id: s3check24
        shell: bash
        run: |
          set -euo pipefail
          KEY="ubuntu24/app-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif"
          if aws s3api head-object --bucket "${{ env.BUCKET }}" --key "${KEY}" >/dev/null 2>&1; then
            echo "need=false" >> "$GITHUB_OUTPUT"
            echo "Found s3://${{ env.BUCKET }}/${KEY}"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
            echo "Missing s3://${{ env.BUCKET }}/${KEY}"
          fi

      - name: Decide if build is needed
        id: need
        shell: bash
        run: |
          if [ "${{ steps.s3check22.outputs.need }}" = "true" ] || [ "${{ steps.s3check24.outputs.need }}" = "true" ]; then
            echo "need_build=true"  >> "$GITHUB_OUTPUT"
          else
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Start EC2 runner
        if: steps.need.outputs.need_build == 'true'
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0a83ec315e0c93010
          ec2-instance-type: c5ad.8xlarge
          subnet-id: subnet-0496b03cda965787c
          security-group-id: sg-05309e81ca4f5e69b

  build:
    name: Build containers & create SIF files
    needs: start-runner
    if: needs.start-runner.outputs.need_build == 'true'
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 80
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Grab previous build if exists ubuntu22
        if: needs.start-runner.outputs.need22 == 'true'
        run: |
          KEY="ubuntu22/docker22.tar"
          if aws s3api head-object --bucket "${{ env.BUCKET }}" --key "${KEY}" >/dev/null 2>&1; then
            echo "Previous build found (ubuntu22)"
            tmp="/home/ubuntu/tmp"
            aws s3 cp "s3://${{ env.BUCKET }}/ubuntu22/docker22.tar" \
            "${tmp}/docker22.tar" --no-progress --only-show-errors
            docker load -i "$tmp/docker22.tar"
            rm -f "${tmp}/docker22.tar"
          else
            echo "No previous build found (ubuntu22)"
          fi
      - name: Grab previous build if exists ubuntu24
        if: needs.start-runner.outputs.need24 == 'true'
        run: |
          KEY="ubuntu24/docker24.tar"
          if aws s3api head-object --bucket "${{ env.BUCKET }}" --key "${KEY}" >/dev/null 2>&1; then
            echo "Previous build found (ubuntu24)"
            tmp="/home/ubuntu/tmp"
            aws s3 cp "s3://${{ env.BUCKET }}/ubuntu24/docker24.tar" \
            "${tmp}/docker24.tar" --no-progress --only-show-errors
            docker load -i "$tmp/docker24.tar"
            rm -f "${tmp}/docker24.tar"
          else
            echo "No previous build found (ubuntu24)"
          fi

      - name: Build ubuntu22-cuda12 image
        if: needs.start-runner.outputs.need22 == 'true'
        run: |
          docker build \
            -f container/ubuntu22-cuda12/Dockerfile \
            -t ubuntu22-cuda12:ctx-${{ needs.start-runner.outputs.hash22 }} .

      - name: Build ubuntu24-cuda12 image
        if: needs.start-runner.outputs.need24 == 'true'
        run: |
          docker build \
            -f container/ubuntu24-cuda12/Dockerfile \
            -t ubuntu24-cuda12:ctx-${{ needs.start-runner.outputs.hash24 }} .
      
      - name: Prepare scratch for Apptainer
        run: |
          if command -v apptainer >/dev/null 2>&1; then apptainer cache clean -f || true; fi

      - name: Build Apptainer SIF (ubuntu22-cuda12)
        if: needs.start-runner.outputs.need22 == 'true'
        run: |
          set -euxo pipefail
          mkdir -p apptainer/out
          apptainer build \
            apptainer/out/app-ubuntu22-${{ needs.start-runner.outputs.hash22 }}.sif \
            docker-daemon://ubuntu22-cuda12:ctx-${{ needs.start-runner.outputs.hash22 }}
          ls -lh apptainer/out

      - name: Upload docker tar to S3 (ubuntu22-cuda12)
        if: needs.start-runner.outputs.need22 == 'true'
        run: |
          set -euxo pipefail
          docker save -o docker22.tar ubuntu22-cuda12:ctx-${{ needs.start-runner.outputs.hash22 }}
          aws s3 cp \
            docker22.tar \
            s3://${{ env.BUCKET }}/ubuntu22/docker22.tar \
            --metadata artifact-type=docker-image-archive
          rm docker22.tar

      - name: Upload SIF to S3 (ubuntu22-cuda12)
        if: needs.start-runner.outputs.need22 == 'true'
        run: |
          set -euxo pipefail
          aws s3 cp \
            apptainer/out/app-ubuntu22-${{ needs.start-runner.outputs.hash22 }}.sif \
            s3://${{ env.BUCKET }}/ubuntu22/app-${{ needs.start-runner.outputs.hash22 }}.sif \
            --metadata artifact-type=application/vnd.apptainer.sif.layer.v1
          rm apptainer/out/app-ubuntu22-${{ needs.start-runner.outputs.hash22 }}.sif

      - name: Build Apptainer SIF (ubuntu24-cuda12)
        if: needs.start-runner.outputs.need24 == 'true'
        run: |
          set -euxo pipefail
          mkdir -p apptainer/out
          apptainer build \
            apptainer/out/app-ubuntu24-${{ needs.start-runner.outputs.hash24 }}.sif \
            docker-daemon://ubuntu24-cuda12:ctx-${{ needs.start-runner.outputs.hash24 }}
          ls -lh apptainer/out
      
      - name: Upload docker tar to S3 (ubuntu24-cuda12)
        if: needs.start-runner.outputs.need24 == 'true'
        run: |
          set -euxo pipefail
          docker save -o docker24.tar ubuntu24-cuda12:ctx-${{ needs.start-runner.outputs.hash24 }}
          aws s3 cp \
            docker24.tar \
            s3://${{ env.BUCKET }}/ubuntu24/docker24.tar \
            --metadata artifact-type=docker-image-archive

      - name: Upload SIF to S3 (ubuntu24-cuda12)
        if: needs.start-runner.outputs.need24 == 'true'
        run: |
          set -euxo pipefail
          aws s3 cp \
            apptainer/out/app-ubuntu24-${{ needs.start-runner.outputs.hash24 }}.sif \
            s3://${{ env.BUCKET }}/ubuntu24/app-${{ needs.start-runner.outputs.hash24 }}.sif \
            --metadata artifact-type=application/vnd.apptainer.sif.layer.v1

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - build
    runs-on: ubuntu-latest
    if: ${{ needs.start-runner.outputs.need_build == 'true' && always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
          
  test_after_build:
    name: Run tests (after fresh build)
    needs: [start-runner, build]
    if: needs.start-runner.outputs.need_build == 'true'
    runs-on: [ self-hosted, test ]
    steps:
      - name: Run tests inside container
        uses: ./.github/actions/run-tests
        with:
          hash22: ${{ needs.start-runner.outputs.hash22 }}
          hash24: ${{ needs.start-runner.outputs.hash24 }}
        env:
          BUCKET: drift-oci-bucket
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

  test_from_cache:
    name: Run tests (using cached SIF)
    needs: [start-runner]
    if: needs.start-runner.outputs.need_build != 'true'
    runs-on: [ self-hosted, test ]
    steps:
      - name: Run tests inside container
        uses: ./.github/actions/run-tests
        with:
          hash22: ${{ needs.start-runner.outputs.hash22 }}
          hash24: ${{ needs.start-runner.outputs.hash24 }}
        env:
          BUCKET: drift-oci-bucket
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

