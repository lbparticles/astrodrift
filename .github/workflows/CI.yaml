name: Build & Publish Docker + Apptainer (same VM)

on:
  push:
    branches: [ actions-runner-setup ]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  BUCKET: drift-oci-bucket
  APPTAINER_TMPDIR: /mnt/gha/tmp
  APPTAINER_CACHEDIR: /mnt/gha/cache
  TMPDIR: /mnt/gha/tmp

jobs:
  build-publish:
    runs-on: [ self-hosted, vm ]
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute short hashes for Dockerfiles
        id: hash
        shell: bash
        run: |
          set -euo pipefail

          short_hash() {
            local path="$1"
            git ls-files -z -- "$path/Dockerfile" 2>/dev/null \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -c1-8
          }

          HASH22=$(short_hash container/ubuntu22-cuda12)
          HASH24=$(short_hash container/ubuntu24-cuda12)

          {
            echo "hash_ubuntu22_cuda12=$HASH22"
            echo "hash_ubuntu24_cuda12=$HASH24"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ubuntu22-cuda12 image
        run: |
          docker build \
            -f container/ubuntu22-cuda12/Dockerfile \
            -t ubuntu22-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }} .

      - name: Build and push ubuntu24-cuda12 image
        run: |
          docker build \
            -f container/ubuntu24-cuda12/Dockerfile \
            -t ubuntu24-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }} .
      
      - name: Prepare scratch for Apptainer
        run: |
          if command -v apptainer >/dev/null 2>&1; then apptainer cache clean -a || true; fi

      - name: Build Apptainer SIF (ubuntu22-cuda12)
        run: |
          set -euxo pipefail
          mkdir -p apptainer/out
          apptainer build \
            apptainer/out/app-ubuntu22-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif \
            docker-daemon://ubuntu22-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}
          ls -lh apptainer/out

      - name: Build Apptainer SIF (ubuntu24-cuda12)
        run: |
          set -euxo pipefail
          mkdir -p apptainer/out
          apptainer build \
            apptainer/out/app-ubuntu24-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif \
            docker-daemon://ubuntu24-cuda12:ctx-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}
          ls -lh apptainer/out

      - name: Upload SIF to S3 (ubuntu22-cuda12)
        run: |
          set -euxo pipefail
          aws s3 cp \
            apptainer/out/app-ubuntu22-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif \
            s3://${{ env.BUCKET }}/ubuntu22/app-${{ steps.hash.outputs.hash_ubuntu22_cuda12 }}.sif \
            --metadata artifact-type=application/vnd.apptainer.sif.layer.v1

      - name: Upload SIF to S3 (ubuntu24-cuda12)
        run: |
          set -euxo pipefail
          aws s3 cp \
            apptainer/out/app-ubuntu24-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif \
            s3://${{ env.BUCKET }}/ubuntu24/app-${{ steps.hash.outputs.hash_ubuntu24_cuda12 }}.sif \
            --metadata artifact-type=application/vnd.apptainer.sif.layer.v1

