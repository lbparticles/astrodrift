name: Python checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install Just
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends just

      - name: Run Python checks
        run: just lint python
