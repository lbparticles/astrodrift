[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "astrodrift"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.4",
]

[tool.maturin]
# No `features` here on purpose, so the CLI flag is authoritative:
#   maturin develop                     -> default features  = modern (0.1.0)
#   maturin develop --features legacy   -> legacy flavor     (0.1.0+legacy,
#                                          via scripts/build-legacy.sh)
# pyo3/extension-module is enabled unconditionally on unix via
# [target.'cfg(unix)'.dependencies].
# The modern extension embeds the cuda-oxide kernels.cubin; run
# ./build-cuda-oxide-kernels.sh before maturin/uv builds.
python-source = "python"
module-name = "drift.drift_rs"


[dependency-groups]
dev = [
    "astrodrift",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
[tool.pytest.ini_options]
addopts = "--maxfail=1 --cov=drift --cov-report=term-missing"



[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "rust/Cargo.toml"}, {file = "**/*.rs"}]




