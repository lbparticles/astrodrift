[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "astrodrift"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.4",
]

[tool.maturin]
# Build the python extension against the cuda-oxide kernel (kernels.cubin built
# by ./build-cuda-oxide-kernels.sh). no-default-features disables the legacy
# nvvm backend, which needs LLVM 7 and is not required for cuda-oxide.
features = ["pyo3/extension-module", "cuda-oxide-kernel"]
no-default-features = true
python-source = "python"
module-name = "drift.drift_rs"


[dependency-groups]
dev = [
    "astrodrift",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
[tool.pytest.ini_options]
addopts = "--maxfail=1 --cov=drift --cov-report=term-missing"



[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "rust/Cargo.toml"}, {file = "**/*.rs"}]




