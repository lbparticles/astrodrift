[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "astrodrift"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.4",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "drift.drift_rs"


[dependency-groups]
dev = [
    "astrodrift",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
[tool.pytest.ini_options]
addopts = "--maxfail=1 --cov=drift --cov-report=term-missing"



[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "rust/Cargo.toml"}, {file = "**/*.rs"}]


[tool.basedpyright]
# "standard" is pyright's default ruleset; basedpyright's own default
# ("recommended") bans `Any` outright, which the compiled-module stub
# cannot satisfy.
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["python", "tests"]




