[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "astrodrift"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.4",
]

[tool.maturin]
# ABI compatibility starts at CPython 3.13; supported minors are still tested.
features = ["pyo3/extension-module", "pyo3/abi3-py313"]
python-source = "python"
module-name = "drift.drift_rs"

[dependency-groups]
dev = [
    "basedpyright==1.39.10",
    "maturin[zig]==1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pyrefly==1.3.1",
    "ruff==0.16.6",
    "ty==0.0.78",
]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --cov=drift --cov-report=term-missing"
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["python", "tests"]
extraPaths = ["python"]

[tool.pyrefly]
project-includes = ["python/**/*.py", "python/**/*.pyi", "tests/**/*.py"]
search-path = ["python"]
python-version = "3.13"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.lock" },
    { file = "Cargo.toml" },
    { file = "kernels/Cargo.toml" },
    { file = "shared/Cargo.toml" },
    { file = "**/*.rs" },
]
