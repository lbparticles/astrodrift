[package]
name = "drift"
version = "0.1.0"
edition = "2024"

[lib]
name = "drift_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
shared = { path = "shared"}
pyo3 = "0.28.3"
# Host-side CUDA driver runtime (context/module/stream/buffers). Pinned in
# Cargo.lock to the same commit as the local cuda-oxide checkout used for
# kernel builds.
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide", package = "cuda-core", branch = "main" }
ndarray-rand = "0.16.0"
rand = "0.10.1"
rayon = "1.11.0"
libm = "0.2.11"
statrs = "0.18.0"
numpy = "0.28.0"
libc = "0.2.177"
thiserror = "2.0.17"

[build-dependencies]
# Optional: only needed for the legacy Rust-CUDA nvvm backend (requires LLVM 7
# via LLVM_CONFIG, see container/ubuntu24-cuda13/Dockerfile). The cuda-oxide
# path (cuda-oxide-kernel) does not need it.
cuda_builder = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cuda_builder", branch = "main", features = ["rustc_codegen_nvvm"], optional = true }

[package.metadata.maturin]
name = "drift"

[workspace]
members = ["shared", "."]

[features]
default = ["nvvm-kernel"]
extension-module = ["pyo3/extension-module"]
cuda-oxide-kernel = []
# Legacy Rust-CUDA nvvm kernel builder (LLVM 7). Default so existing container
# workflows keep working; the python build disables it (see pyproject.toml).
nvvm-kernel = ["dep:cuda_builder"]
galpy-kepler-reference = []


[target.'cfg(unix)'.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
# Nothing here — we explicitly do NOT support Windows

# [profile.release]
# opt-level = 2
# codegen-units = 1
# debug = false

# [profile.test]
# opt-level = 2
# codegen-units = 1
# debug = false

[profile.dev]
opt-level = 0
debug = 2
