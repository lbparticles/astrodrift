[package]
name = "drift"
# Wheel versions select the release flavor (maturin reads this via
# dynamic = ["version"] in pyproject.toml):
#   default build (--features default, i.e. plain `maturin develop`) -> modern
#     cuda-oxide + LLVM 21 only, wheel version 0.1.0
#   `--features legacy` -> legacy Rust-CUDA nvvm pipeline (needs the custom
#     LLVM 7; see env/shell-legacy.nix and scripts/build-legacy.sh)
# Cargo cannot vary [package] version by feature, so the legacy wrapper
# flips this line around the build and restores it afterwards.
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
name = "drift_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
shared = { path = "shared"}
pyo3 = "0.28.3"
# Host-side CUDA driver runtime (context/module/stream/buffers). Pinned in
# Cargo.lock to 97f8b2b7, the same commit as the local cuda-oxide checkout
# used for kernel builds.
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide", package = "cuda-core", branch = "main" }
ndarray-rand = "0.16.0"
rand = "0.10.1"
rayon = "1.11.0"
libm = "0.2.11"
statrs = "0.18.0"
numpy = "0.28.0"
libc = "0.2.177"
thiserror = "2.0.17"

# Optional legacy kernel builder: compiles kernels/ to PTX at build time via
# rustc_codegen_nvvm. Requires the custom LLVM 7 build (LLVM_CONFIG,
# LLVM_LINK_STATIC=1). Only activated by `--features legacy`; the default
# modern build embeds the cubin from ./build-cuda-oxide-kernels.sh instead.
[build-dependencies]
cuda_builder = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cuda_builder", branch = "main", features = ["rustc_codegen_nvvm"], optional = true }


[package.metadata.maturin]
name = "drift"

[workspace]
members = ["shared", "."]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# --- Curated allowances for this codebase (justified, not blanket silence) ---
# Numerics fidelity: constants are transliterated verbatim from the DOPRI54 /
# DOP853 reference sources; digit grouping / truncation churns diffs and
# invites transcription bugs.
unreadable_literal = "allow"
excessive_precision = "allow"
# Reference-style signatures: transliterated Fortran/C integrators keep their
# pointer walks, dimensions and argument counts for reviewability.
too_many_arguments = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# CUDA/PyO3 FFI: c_int dims -> usize indexing, kernel-arg arrays built from
# borrows, and deliberate hash/address truncation.
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
borrow_as_ptr = "allow"
ptr_as_ptr = "allow"
ptr_cast_constness = "allow"
# Device `force` hot path relies on inlining for kernel codegen.
inline_always = "allow"
# Doc churn on PyO3 methods / internal Result plumbing in research code.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_name_repetitions = "allow"
# PyO3 method params need Python-side names but are unused on the Rust side.
used_underscore_binding = "allow"
# --- JPL Power-of-Ten hard denials (tools/JPL10.md) ---
exit = "deny"                      # no silent process termination in a library
let_underscore_must_use = "deny"   # R7: every return value is inspected
unreachable = "deny"               # R1: no unreachable code paths
unimplemented = "deny"             # R10: no placeholder panics
todo = "deny"                      # R10
infinite_loop = "deny"             # R2: loop bounds must be derivable

[features]
# default = modern: cuda-oxide cubin (LLVM 21 only), wheel version 0.1.0
default = []
# legacy: kernels compiled to PTX by rustc_codegen_nvvm (custom LLVM 7);
# wheel version 0.1.0+legacy via scripts/build-legacy.sh. Host dispatch is
# cuda-core in both flavors (cuModuleLoadData accepts PTX and cubin).
legacy = ["dep:cuda_builder"]
extension-module = ["pyo3/extension-module"]
galpy-kepler-reference = []


[target.'cfg(unix)'.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
# Nothing here — we explicitly do NOT support Windows

# [profile.release]
# opt-level = 2
# codegen-units = 1
# debug = false

# [profile.test]
# opt-level = 2
# codegen-units = 1
# debug = false

[profile.dev]
opt-level = 0
debug = 2
