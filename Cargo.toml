[package]
name = "drift"
version = "0.1.0"
edition = "2024"

[lib]
name = "drift_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
shared = { path = "shared"}
pyo3 = "0.28.3"
blastoff = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "blastoff", branch = "main" }
cust = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cust", branch = "main" }
cust_raw = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cust_raw", branch = "main", features = ["driver"] }
ndarray-rand = "0.16.0"
rand = "0.10.1"
rayon = "1.11.0"
libm = "0.2.11"
statrs = "0.18.0"
numpy = "0.28.0"
libc = "0.2.177"
thiserror = "2.0.17"

[build-dependencies]
cuda_builder = { git = "https://github.com/Rust-GPU/Rust-CUDA", package = "cuda_builder", branch = "main", features = ["rustc_codegen_nvvm"] }

[package.metadata.maturin]
name = "drift"

[workspace]
members = ["shared", "."]

[features]
default = []
extension-module = ["pyo3/extension-module"]


[target.'cfg(unix)'.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
# Nothing here — we explicitly do NOT support Windows

# [profile.release]
# opt-level = 2
# codegen-units = 1
# debug = false

# [profile.test]
# opt-level = 2
# codegen-units = 1
# debug = false

[profile.dev]
opt-level = 0
debug = 2

