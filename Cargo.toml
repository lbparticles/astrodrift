[package]
name = "drift"
# Local version segment tags this wheel build as the modern (cuda-oxide +
# LLVM 21 only) release: wheel filename becomes
# astrodrift-0.1.0+modern-<pytag>-<abitag>-<plattag>.whl
version = "0.1.0+modern"
edition = "2024"

[lib]
name = "drift_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
shared = { path = "shared"}
pyo3 = "0.28.3"
# Host-side CUDA driver runtime (context/module/stream/buffers). Pinned in
# Cargo.lock to 97f8b2b7, the same commit as the local cuda-oxide checkout
# used for kernel builds.
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide", package = "cuda-core", branch = "main" }
ndarray-rand = "0.16.0"
rand = "0.10.1"
rayon = "1.11.0"
libm = "0.2.11"
statrs = "0.18.0"
numpy = "0.28.0"
libc = "0.2.177"
thiserror = "2.0.17"

# NOTE: no [build-dependencies] on purpose. The legacy LLVM 7 pipeline
# (cuda_builder + rustc_codegen_nvvm) is gone; kernels arrive as a
# prebuilt cubin produced by build-cuda-oxide-kernels.sh (LLVM 21 stack).


[package.metadata.maturin]
name = "drift"

[workspace]
members = ["shared", "."]

[features]
# The cuda-oxide cubin path is the only supported one in this branch.
default = ["cuda-oxide-kernel"]
extension-module = ["pyo3/extension-module"]
galpy-kepler-reference = []


[target.'cfg(unix)'.dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
# Nothing here — we explicitly do NOT support Windows

# [profile.release]
# opt-level = 2
# codegen-units = 1
# debug = false

# [profile.test]
# opt-level = 2
# codegen-units = 1
# debug = false

[profile.dev]
opt-level = 0
debug = 2
